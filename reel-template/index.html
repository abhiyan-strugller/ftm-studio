<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;width:1080px;height:1920px;overflow:hidden;background:#f3ecdc}
  #stage{position:relative;width:1080px;height:1920px}
  canvas{position:absolute;left:0;top:0}
  .scene{position:absolute;inset:0;opacity:0;z-index:2}
  .col{position:absolute;left:80px;right:80px;top:310px;height:1230px;display:flex;flex-direction:column;justify-content:center}
  .t{opacity:0;will-change:transform,opacity}
  .hd{font-family:'Inter',sans-serif;font-weight:900;letter-spacing:-1px;line-height:1.03}
  .bd{font-family:'Inter',sans-serif;font-weight:600;line-height:1.32}
  .lb{font-family:'Inter',sans-serif;font-weight:700;letter-spacing:5px}
  .ink{color:#1d1a16}.muted{color:#6b6255}
  #brand{position:absolute;left:80px;top:180px;font:800 30px 'Inter';letter-spacing:6px;color:#1d1a16;z-index:10}
  #prog{position:absolute;left:80px;right:80px;top:240px;height:6px;background:#e2d8c3;border-radius:3px;z-index:10}
  #prog i{display:block;height:100%;width:0;border-radius:3px}
  #src{position:absolute;left:80px;right:80px;top:1575px;font:500 26px 'Inter';color:#6b6255;z-index:10}
  #veil{position:absolute;inset:0;background:#f3ecdc;opacity:0;pointer-events:none;z-index:5}
</style>
</head>
<body>
<div id="stage">
  <div id="brand">FOLLOW <b></b> MONEY</div>
  <div id="prog"><i></i></div>
  <div id="scenes"></div>
  <div id="src"></div>
  <div id="veil"></div>
</div>
<script src="brush.js"></script>
<script>
const R = window.REEL;
const W=1080, H=1920, FPS=30;
const PAPER='#f3ecdc', INK='#1d1a16', MUTED='#6b6255';
const GREEN='#1f5c3f', GOLD='#d9a441', RED='#b8322a';
const ACC = (R.style && R.style.accent === 'gold') ? GOLD : GREEN;
const DARKFIRST = !!(R.style && R.style.first === 'dark');

document.getElementById('brand').innerHTML = 'FOLLOW <b style="color:'+ACC+'">THE</b> MONEY';
document.querySelector('#prog i').style.background = ACC;
document.getElementById('src').textContent = R.source_line || '';

// ---------- deterministic per-slug seed ----------
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return Math.abs(h);}
const SEED0 = hashStr(R.slug||'reel') % 9973;

// ---------- durations ----------
const DEF={hook:4.2, body:5.0, take:5.2, end:5.0};
let durs = R.slides.map(s => (typeof s.seconds==='number'? s.seconds : (DEF[s.kind]||4.5)));
const MAXT = 32, MINS = 2.6;
let tot = durs.reduce((a,b)=>a+b,0);
if (tot > MAXT){ const k = MAXT/tot; durs = durs.map(d=>Math.max(MINS, +(d*k).toFixed(2))); }
const SCENES = durs;
window.SCENES = SCENES;
const TOTAL = SCENES.reduce((a,b)=>a+b,0);
window.TOTAL = TOTAL;
// paint finishes well before the scene ends, then freezes (saves frames)
const BRUSH_END = SCENES.map(d => Math.max(1.2, Math.min(d-0.6, 3.0)));

const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=p=>1-Math.pow(1-clamp(p),3);
const lerp=(a,b,p)=>a+(b-a)*p;
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function bigSize(s){const n=(s||'').length; if(n<=3)return 350; if(n<=5)return 300; if(n<=9)return 215; if(n<=15)return 158; return 118;}

// ---------- build scene DOM ----------
function headSize(t){const n=(t||'').length; if(n<=24)return 112; if(n<=50)return 92; if(n<=85)return 76; return 62;}
function bodySize(ls){const n=ls.reduce((a,b)=>a+b.length,0); if(n<=70)return 80; if(n<=130)return 70; if(n<=200)return 62; return 54;}
const host=document.getElementById('scenes');
R.slides.forEach((s,i)=>{
  const d=document.createElement('div'); d.className='scene'; d.id='s'+i;
  let html='<div class="col">', lines=(s.lines||[]).slice();
  const k=s.kind;
  if(k==='take' && lines.length && /^my take:?\s*$/i.test(lines[0])) lines.shift();
  if((k==='hook'||k==='body') && s.big){
    html+='<div class="t hd" data-big="1" data-in="0.3" style="font-size:'+bigSize(s.big)+'px;margin-bottom:58px">'+esc(s.big)+'</div>';
  }
  if(k==='take'){
    html+='<div class="t lb" data-in="0.15" style="font-size:34px;color:'+ACC+';margin-bottom:40px">MY TAKE</div>';
  }
  const bs=bodySize(lines);
  lines.forEach((ln,j)=>{
    const first=j===0, headish=(k==='take'||k==='end')&&first;
    const cls=headish?'t hd ink':'t bd ink';
    const fs=headish?headSize(ln):bs;
    const delay=(k==='hook'? 1.25 : (k==='take'?0.5:0.35)) + j*0.6;
    html+='<div class="'+cls+'" data-in="'+delay.toFixed(2)+'" style="font-size:'+fs+'px;margin-bottom:'+(j<lines.length-1?30:0)+'px">'+esc(ln)+'</div>';
  });
  if(k==='end'){
    html+='<div class="t lb" data-in="'+(1.6+lines.length*0.4).toFixed(2)+'" style="font-size:32px;color:'+ACC+';margin-top:60px">TELL ME IN THE COMMENTS</div>';
  }
  html+='</div>';
  d.innerHTML=html; host.appendChild(d);
});

// ---------- measure real text geometry so the paint fits the words ----------
const GEO=R.slides.map((_,i)=>{
  const el=document.getElementById('s'+i);
  el.style.opacity=1;
  const ts=[].slice.call(el.querySelectorAll('.t'));
  ts.forEach(t=>{t.style.opacity=1;t.style.transform='none';});
  const rs=ts.map(t=>{const r=t.getBoundingClientRect();return {x:r.left,y:r.top,w:r.width,h:r.height,el:t};});
  ts.forEach(t=>{t.style.opacity=0;});
  el.style.opacity=0;
  const big=rs.filter(r=>r.el.dataset.big)[0];
  const head=rs.filter(r=>r.el.classList.contains('hd'))[0];
  const top=rs.length?rs[0].y:420, bot=rs.length?rs[rs.length-1].y+rs[rs.length-1].h:1300;
  return {rs:rs,big:big,head:head,top:top,bot:bot};
});

// ---------- brush canvas ----------
brush.createCanvas(W,H,{parent:document.getElementById('stage'), pixelDensity:1});
const glCanvas=document.querySelector('#stage canvas');
glCanvas.style.visibility='hidden';
const flat=document.createElement('canvas'); flat.width=W; flat.height=H; flat.style.zIndex=0;
document.getElementById('stage').prepend(flat);
const flatCtx=flat.getContext('2d');
brush.scaleBrushes(5);
brush.angleMode(brush.DEGREES);

function wash(x,y,w,h,col,op,sd){ if(w<2||h<2)return; brush.seed(sd); brush.noStroke(); brush.fill(col,op); brush.fillBleed(0.12,'out'); brush.fillTexture(0.35,0.4); brush.rect(x,y,w,h); brush.noFill(); }
function pline(x1,y1,x2,y2,p){ if(p<=0.01)return; brush.line(x1,y1,lerp(x1,x2,p),lerp(y1,y2,p)); }
function stroke(name,col,wt,sd){ brush.seed(sd); brush.set(name,col,wt); }
function ellipsePts(cx,cy,rx,ry,n=36,rot=0){const a=[];for(let i=0;i<n;i++){const t=(i/n)*Math.PI*2,x=Math.cos(t)*rx,y=Math.sin(t)*ry,c=Math.cos(rot),s=Math.sin(rot);a.push([cx+x*c-y*s,cy+x*s+y*c]);}return a;}
function growShape(pts,p,close){ const n=Math.max(2,Math.floor(pts.length*clamp(p))); brush.beginShape(0.55); for(let i=0;i<n;i++) brush.vertex(pts[i][0],pts[i][1]); brush.endShape(close && p>0.98); }

// generic paint per slide kind — varies by slug seed so no two reels look alike
function DRAW(i,t){
  const sl=R.slides[i], k=sl.kind, sd=SEED0+i*37, g=GEO[i];
  const jit=((SEED0%7)-3);
  if(k==='hook'||(k==='body'&&sl.big)){
    const b=g.big||{x:80,y:g.top,w:920,h:160};
    const w=ease((t-0.05)/0.9);
    wash(b.x-26, b.y-26+jit, (b.w+52)*w, b.h+52, ACC, 64, sd);
    const u=ease((t-0.9)/0.7);
    if(u>0){ stroke('marker',RED,2.2,sd+1); const y=b.y+b.h+30+jit; pline(b.x+4,y,b.x+Math.min(b.w,840),y-8,u); brush.noStroke(); }
    const ar=ease((t-1.25)/0.7);
    if(ar>0 && b.x+b.w<900){ const ax=b.x+b.w+52, ay=b.y+b.h*0.72;
      stroke('marker',ACC,2.0,sd+3); pline(ax,ay,ax+70,ay-110,ar);
      if(ar>0.9){brush.line(ax+70,ay-110,ax+22,ay-86);brush.line(ax+70,ay-110,ax+80,ay-58);} brush.noStroke(); }
  }
  if(k==='take'){
    const h=g.head||{x:80,y:g.top,w:920,h:120};
    const w=ease((t-0.1)/0.9);
    wash(h.x-24, h.y-22, (h.w+48)*w, h.h+44, ACC, 54, sd);
    const u=ease((t-0.95)/0.8);
    if(u>0){ stroke('marker',RED,2.2,sd+1); const y=h.y+h.h+26; pline(h.x+4,y,h.x+Math.min(h.w,880),y-9,u); brush.noStroke(); }
  }
  if(k==='end'){
    const b=ease((t-0.3)/1.0);
    const y0=Math.max(380,g.top-70), y1=Math.min(1520,g.bot+74);
    if(b>0){
      brush.seed(sd+1); brush.noStroke(); brush.fill(ACC,56*b); brush.fillBleed(0.1); brush.fillTexture(0.3,0.6);
      brush.rect(48,y0,984*b,y1-y0); brush.noFill();
      stroke('HB',INK,1.2,sd+2);
      pline(48,y0,1032,y0,b); pline(1032,y1,48,y1-4,b);
      if(b>0.95){ brush.line(150,y1,112,y1+74); brush.line(112,y1+74,214,y1-2); }
      brush.noStroke();
    }
  }
  if(k==='body'){
    const bar=ease((t-0.1)/0.85);
    const y0=Math.max(360,g.top-24), hgt=Math.min(1180,(g.bot+24)-y0);
    wash(52, y0, 26, hgt*bar, ACC, 155, sd+1);
    const u=ease((t-0.85)/0.8);
    if(u>0){ stroke('HB',MUTED,1.0,sd+2); const y=Math.min(1545,g.bot+46); pline(104,y,994,y-5,u); brush.noStroke(); }
  }
}

// ---------- frame renderer ----------
const sceneEls=SCENES.map((_,i)=>document.getElementById('s'+i));
let lastKey=null;
window.renderFrame=function(si,f){
  const t=f/FPS, dur=SCENES[si];
  const bt=Math.min(Math.floor(f/4)*4/FPS, BRUSH_END[si]); // paint on fours, then freeze
  const key=si+':'+bt.toFixed(3);
  if(key!==lastKey){
    brush.clear(PAPER);
    brush.push(); brush.translate(-W/2,-H/2); DRAW(si,bt); brush.pop(); brush.render();
    flatCtx.drawImage(glCanvas,0,0,W,H);
    lastKey=key;
  }
  sceneEls.forEach((el,i)=>el.style.opacity = i===si?1:0);
  sceneEls[si].querySelectorAll('.t').forEach(el=>{
    const p=ease((t-parseFloat(el.dataset.in))/0.5);
    el.style.opacity=p;
    el.style.transform='translateY('+((1-p)*40)+'px)';
  });
  const before=SCENES.slice(0,si).reduce((a,b)=>a+b,0);
  document.querySelector('#prog i').style.width=((before+t)/TOTAL*100)+'%';
  const fin=1-clamp(t/0.25), fout=clamp((t-(dur-0.35))/0.35);
  const last=si===SCENES.length-1;
  document.getElementById('veil').style.opacity = si===0 ? fout : (last ? fin : Math.max(fin,fout));
};
window.ready=true;
</script>
</body>
</html>
