<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;width:1080px;height:1920px;overflow:hidden;background:#f3ecdc}
  #stage{position:relative;width:1080px;height:1920px}
  canvas{position:absolute;left:0;top:0}
  .scene{position:absolute;inset:0;opacity:0;z-index:2}
  .col{position:absolute;left:80px;right:80px;display:flex;flex-direction:column}
  .t{opacity:0;will-change:transform,opacity}
  .cl{position:absolute;opacity:0;will-change:transform,opacity}
  .hd{font-family:'Inter',sans-serif;font-weight:900;letter-spacing:-1px;line-height:1.03}
  .bd{font-family:'Inter',sans-serif;font-weight:600;line-height:1.32}
  .lb{font-family:'Inter',sans-serif;font-weight:700;letter-spacing:5px}
  .ink{color:#1d1a16}.muted{color:#6b6255}
  #brand{position:absolute;left:80px;top:180px;font:800 30px 'Inter';letter-spacing:6px;color:#1d1a16;z-index:10}
  #prog{position:absolute;left:80px;right:80px;top:240px;height:6px;background:#e2d8c3;border-radius:3px;z-index:10}
  #prog i{display:block;height:100%;width:0;border-radius:3px}
  #src{position:absolute;left:80px;right:80px;top:1575px;font:500 26px 'Inter';color:#6b6255;z-index:10}
  #veil{position:absolute;inset:0;background:#f3ecdc;opacity:0;pointer-events:none;z-index:5}
</style>
</head>
<body>
<div id="stage">
  <div id="brand">FOLLOW <b></b> MONEY</div>
  <div id="prog"><i></i></div>
  <div id="scenes"></div>
  <div id="src"></div>
  <div id="veil"></div>
</div>
<script src="brush.js"></script>
<script>
const R=window.REEL;
const W=1080,H=1920,FPS=30;
const PAPER='#f3ecdc',INK='#1d1a16',MUTED='#6b6255';
const GREEN='#1f5c3f',GOLD='#d9a441',RED='#b8322a',BROWN='#9a5a2b',DEEP='#7d4420';
const ACC=(R.style&&R.style.accent==='gold')?GOLD:GREEN;
document.getElementById('brand').innerHTML='FOLLOW <b style="color:'+ACC+'">THE</b> MONEY';
document.querySelector('#prog i').style.background=ACC;
document.getElementById('src').textContent=R.source_line||'';

function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return Math.abs(h);}
const SEED0=hashStr(R.slug||'reel')%9973;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=p=>1-Math.pow(1-clamp(p),3);
const lerp=(a,b,p)=>a+(b-a)*p;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// ---------- pick an illustration that fits the story ----------
const MOTIF_WORDS=[
 ['turkey',['turkey','thanksgiving','dinner table','roast']],
 ['cart',['grocer','groceries','supermarket','food price','basket']],
 ['bag',['retail','shopping','black friday','store','shopper','holiday spend']],
 ['car',['car ','cars','auto loan','auto debt','vehicle','truck','drivers']],
 ['house',['house','housing','mortgage','rent','home price','real estate']],
 ['fuel',['gas ','gasoline','oil','fuel','pump','barrel','crude']],
 ['coin',['bitcoin','crypto','btc','ether','token']],
 ['candles',['stock','s&p','nasdaq','index','shares','market','wall street']],
 ['bank',['bank','fed','interest rate','rate cut','rate hike','central bank','loan','credit','debt']],
 ['paycheck',['paycheck','wage','salary','job','hiring','layoff','employment','payroll']],
 ['chip',['chip','semiconductor','nvidia','ai ','data cent']],
 ['plane',['airline','flight','travel','airfare']],
 ['cash',['inflation','cost of living','prices','savings','cash','dollar','budget']]
];
function pickMotif(){
  const hay=((R.title||'')+' '+R.slides.map(s=>(s.big||'')+' '+(s.lines||[]).join(' ')).join(' ')).toLowerCase();
  for(const [name,keys] of MOTIF_WORDS) for(const k of keys) if(hay.indexOf(k)>=0) return name;
  return 'cash';
}
const MOTIF=pickMotif();

// ---------- durations ----------
const DEF={hook:4.6,body:5.0,take:5.2,end:5.0};
let durs=R.slides.map(s=>(typeof s.seconds==='number'?s.seconds:(DEF[s.kind]||4.5)));
let tot=durs.reduce((a,b)=>a+b,0);
const MAXT=34;
if(tot>MAXT){const k=MAXT/tot;durs=durs.map(d=>Math.max(2.6,+(d*k).toFixed(2)));}
const SCENES=durs; window.SCENES=SCENES;
const TOTAL=SCENES.reduce((a,b)=>a+b,0); window.TOTAL=TOTAL;
const BRUSH_END=SCENES.map(d=>Math.max(1.4,Math.min(d-0.6,3.4)));

function bigSize(s){const n=(s||'').length;if(n<=3)return 330;if(n<=5)return 280;if(n<=9)return 205;if(n<=15)return 150;return 112;}
function headSize(t){const n=(t||'').length;if(n<=24)return 108;if(n<=50)return 88;if(n<=85)return 72;return 60;}
function bodySize(ls,tight){const n=ls.reduce((a,b)=>a+b.length,0);const k=tight?0.82:1;
  let v;if(n<=70)v=78;else if(n<=130)v=68;else if(n<=200)v=60;else v=52;return Math.round(v*k);}

// ---------- chart geometry (paint and labels share it) ----------
const CX0=90,CX1=990,CY0=900,CY1=1455;
function chartGeom(ch){
  const d=ch.data||[];
  if(ch.type==='rank'){
    const n=Math.max(1,d.length), rowH=Math.min(132,(CY1-CY0)/n);
    const max=Math.max.apply(null,d.map(x=>Math.abs(x[1]))) || 1;
    return {t:'rank',n,rowH,max,barW:470,x:CX0,y:CY0};
  }
  const n=Math.max(1,d.length), gap=26, bw=(CX1-CX0-gap*(n-1))/n;
  const vs=d.map(x=>x[1]), max=Math.max.apply(null,vs), min=Math.min.apply(null,vs);
  const lo=min-(max-min)*0.75;
  return {t:'bars',n,gap,bw,max,lo:(isFinite(lo)?lo:0),x:CX0,y0:CY0+70,y1:CY1};
}
function fmtVal(v,unit){
  unit=unit||'';
  if(unit==='%')return (v>0?'+':'')+v+'%';
  if(unit==='$')return '$'+(Math.abs(v)<100?v.toFixed(2):Math.round(v));
  return unit?unit+v:String(v);
}

// ---------- build scene DOM ----------
const host=document.getElementById('scenes');
R.slides.forEach((s,i)=>{
  const d=document.createElement('div'); d.className='scene'; d.id='s'+i;
  const ch=s.chart&&s.chart.data&&s.chart.data.length?s.chart:null;
  const hasArt=ch||(s.kind==='hook');
  const colTop=310, colH=hasArt?520:1230;
  let html='<div class="col" style="top:'+colTop+'px;height:'+colH+'px;justify-content:'+(hasArt?'flex-start':'center')+'">';
  let lines=(s.lines||[]).slice();
  const k=s.kind;
  if(k==='take'&&lines.length&&/^my take:?\s*$/i.test(lines[0]))lines.shift();
  if((k==='hook'||k==='body')&&s.big)
    html+='<div class="t hd" data-big="1" data-in="0.3" style="font-size:'+bigSize(s.big)+'px;margin-bottom:'+(hasArt?26:58)+'px">'+esc(s.big)+'</div>';
  if(k==='take')
    html+='<div class="t lb" data-in="0.15" style="font-size:34px;color:'+ACC+';margin-bottom:40px">MY TAKE</div>';
  const bs=bodySize(lines,!!hasArt);
  lines.forEach((ln,j)=>{
    const headish=(k==='take'||k==='end')&&j===0;
    const fs=headish?headSize(ln):bs;
    const delay=(k==='hook'?1.05:(k==='take'?0.5:0.35))+j*0.55;
    html+='<div class="'+(headish?'t hd ink':'t bd ink')+'" data-in="'+delay.toFixed(2)+'" style="font-size:'+fs+'px;margin-bottom:'+(j<lines.length-1?34:0)+'px">'+esc(ln)+'</div>';
  });
  if(k==='end')
    html+='<div class="t lb" data-in="'+(1.6+lines.length*0.4).toFixed(2)+'" style="font-size:32px;color:'+ACC+';margin-top:58px">TELL ME IN THE COMMENTS</div>';
  html+='</div>';
  // chart labels, positioned off the shared geometry
  if(ch){
    const g=chartGeom(ch), u=ch.unit;
    ch.data.forEach((row,bi)=>{
      const [lab,val]=row, hi=(ch.highlight!=null&&String(ch.highlight)===String(lab));
      const din=(1.0+bi*0.42).toFixed(2), col=hi?RED:INK;
      if(g.t==='rank'){
        const y=g.y+bi*g.rowH;
        html+='<div class="cl bd" data-in="'+din+'" style="left:'+g.x+'px;top:'+y+'px;width:620px;font-size:40px;font-weight:700;color:'+col+'">'+esc(lab)+'</div>';
        html+='<div class="cl hd" data-in="'+(+din+0.25).toFixed(2)+'" style="left:'+(g.x+Math.abs(val)/g.max*g.barW+22)+'px;top:'+(y+48)+'px;font-size:52px;color:'+col+'">'+esc(fmtVal(val,u))+'</div>';
      }else{
        const x=g.x+bi*(g.bw+g.gap);
        const hgt=(val-g.lo)/((g.max-g.lo)||1)*(g.y1-g.y0);
        html+='<div class="cl bd" data-in="'+din+'" style="left:'+(x-14)+'px;top:'+(g.y1+16)+'px;width:'+(g.bw+28)+'px;text-align:center;font-size:36px;font-weight:700;color:'+(hi?RED:MUTED)+'">'+esc(lab)+'</div>';
        html+='<div class="cl hd" data-in="'+(+din+0.25).toFixed(2)+'" style="left:'+(x-24)+'px;top:'+(g.y1-hgt-72)+'px;width:'+(g.bw+48)+'px;text-align:center;font-size:46px;color:'+col+'">'+esc(fmtVal(val,u))+'</div>';
      }
    });
  }
  d.innerHTML=html; host.appendChild(d);
});

// ---------- measure text so paint never collides with words ----------
const GEO=R.slides.map((_,i)=>{
  const el=document.getElementById('s'+i); el.style.opacity=1;
  const ts=[].slice.call(el.querySelectorAll('.t'));
  ts.forEach(t=>{t.style.opacity=1;t.style.transform='none';});
  const rs=ts.map(t=>{const r=t.getBoundingClientRect();return {x:r.left,y:r.top,w:r.width,h:r.height,el:t};});
  ts.forEach(t=>{t.style.opacity=0;}); el.style.opacity=0;
  return {rs,big:rs.filter(r=>r.el.dataset.big)[0],head:rs.filter(r=>r.el.classList.contains('hd'))[0],
          top:rs.length?rs[0].y:420,bot:rs.length?rs[rs.length-1].y+rs[rs.length-1].h:1300};
});

// ---------- brush ----------
brush.createCanvas(W,H,{parent:document.getElementById('stage'),pixelDensity:1});
const gl=document.querySelector('#stage canvas'); gl.style.visibility='hidden';
const flat=document.createElement('canvas'); flat.width=W; flat.height=H; flat.style.zIndex=0;
document.getElementById('stage').prepend(flat);
const fx=flat.getContext('2d');
brush.scaleBrushes(5); brush.angleMode(brush.DEGREES);

function wash(x,y,w,h,c,o,sd){if(w<2||h<2)return;brush.seed(sd);brush.noStroke();brush.fill(c,o);brush.fillBleed(0.12,'out');brush.fillTexture(0.35,0.4);brush.rect(x,y,w,h);brush.noFill();}
function blob(pts,c,o,sd){brush.seed(sd);brush.noStroke();brush.fill(c,o);brush.fillBleed(0.14,'out');brush.fillTexture(0.45,0.5);brush.polygon(pts);brush.noFill();}
function hatched(pts,c,sd,dist,ang){brush.seed(sd);brush.noStroke();brush.hatchStyle('marker');brush.hatch(dist||11,ang||38,{rand:0.1,continuous:false});brush.fill(c,0);brush.polygon(pts);brush.noHatch();brush.noFill();}
function pen(name,c,w,sd){brush.seed(sd);brush.set(name,c,w);}
function pline(x1,y1,x2,y2,p){if(p<=0.01)return;brush.line(x1,y1,lerp(x1,x2,p),lerp(y1,y2,p));}
function ell(cx,cy,rx,ry,n,rot){n=n||36;rot=rot||0;const a=[];for(let i=0;i<n;i++){const t=(i/n)*Math.PI*2,x=Math.cos(t)*rx,y=Math.sin(t)*ry,c=Math.cos(rot),s=Math.sin(rot);a.push([cx+x*c-y*s,cy+x*s+y*c]);}return a;}
function grow(pts,p,close){const n=Math.max(2,Math.floor(pts.length*clamp(p)));brush.beginShape(0.55);for(let i=0;i<n;i++)brush.vertex(pts[i][0],pts[i][1]);brush.endShape(close&&p>0.98);}
function scalePts(pts,cx,cy,k){return pts.map(p=>[cx+(p[0]-cx)*k,cy+(p[1]-cy)*k]);}

// ---------- painted illustrations ----------
const MOTIFS={
  turkey:(cx,cy,S,t,sd)=>{
    const a=ease(t/0.9); if(a<=0)return;
    blob(ell(cx,cy+0.62*S,0.95*S*a,0.26*S*a,40),'#c9b99a',150,sd);
    const b=ease((t-0.35)/0.9); if(b>0){
      blob(ell(cx,cy+0.08*S,0.66*S*b,0.44*S*b,42),BROWN,255,sd+1);
      hatched(ell(cx-0.1*S,cy-0.06*S,0.34*S*b,0.18*S*b,30),GOLD,sd+2,9,30);
      [[-1,0],[1,1]].forEach(([s,o])=>{blob(ell(cx+s*0.56*S,cy-0.12*S,0.22*S*b,0.14*S*b,26,s*0.6),DEEP,255,sd+3+o);
        pen('charcoal',INK,1.2,sd+5+o);pline(cx+s*0.66*S,cy-0.2*S,cx+s*0.82*S,cy-0.38*S,b);brush.noStroke();});
    }
    const c=ease((t-0.8)/0.9); if(c>0){pen('2B',INK,1.3,sd+7);grow(ell(cx,cy+0.08*S,0.67*S,0.45*S,30),c,true);brush.noStroke();}
  },
  car:(cx,cy,S,t,sd)=>{
    const a=ease(t/0.9); if(a<=0)return;
    const body=[[-1,.12],[-.82,-.2],[-.4,-.44],[.34,-.44],[.74,-.16],[1,.1],[1,.3],[-1,.3]].map(p=>[cx+p[0]*S*a,cy+p[1]*S*a]);
    blob(body,ACC,205,sd);
    const b=ease((t-0.3)/0.8); if(b>0){
      hatched([[-.72,-.18],[-.38,-.4],[-.02,-.4],[-.02,-.18]].map(p=>[cx+p[0]*S,cy+p[1]*S]),INK,sd+1,10,45);
      [[-.56,.34],[.56,.34]].forEach((p,i)=>{blob(ell(cx+p[0]*S,cy+p[1]*S,0.19*S*b,0.19*S*b,26),INK,235,sd+2+i);});
    }
    const c=ease((t-0.7)/0.9); if(c>0){pen('2B',INK,1.3,sd+5);grow(body,c,true);brush.noStroke();}
  },
  house:(cx,cy,S,t,sd)=>{
    const a=ease(t/0.9); if(a<=0)return;
    blob([[-.8,1.05],[-.8,-.08],[0,-.78],[.8,-.08],[.8,1.05]].map(p=>[cx+p[0]*S*a,cy+p[1]*S*a]),ACC,185,sd);
    const b=ease((t-0.35)/0.8); if(b>0){
      hatched([[-.84,-.06],[0,-.8],[.84,-.06]].map(p=>[cx+p[0]*S,cy+p[1]*S]),RED,sd+1,10,55);
      blob(ell(cx,cy+0.52*S,0.17*S*b,0.3*S*b,22),INK,215,sd+2);
    }
    const c=ease((t-0.75)/0.9); if(c>0){pen('2B',INK,1.3,sd+4);grow([[-.8,1.05],[-.8,-.08],[0,-.78],[.8,-.08],[.8,1.05]].map(p=>[cx+p[0]*S,cy+p[1]*S]),c,true);brush.noStroke();}
  },
  coin:(cx,cy,S,t,sd)=>{
    const a=ease(t/0.9); if(a<=0)return;
    blob(ell(cx,cy,0.72*S*a,0.72*S*a,40),GOLD,225,sd);
    const b=ease((t-0.35)/0.8); if(b>0)hatched(ell(cx,cy,0.5*S,0.5*S,30),BROWN,sd+1,9,40);
    const c=ease((t-0.7)/0.9); if(c>0){pen('2B',INK,1.4,sd+2);grow(ell(cx,cy,0.73*S,0.73*S,32),c,true);
      pen('charcoal',INK,1.6,sd+3);pline(cx,cy-0.42*S,cx,cy+0.42*S,c);brush.noStroke();}
  },
  cash:(cx,cy,S,t,sd)=>{
    const a=ease(t/0.9); if(a<=0)return;
    for(let i=2;i>=0;i--){const p=ease((t-i*0.22)/0.8);if(p<=0)continue;
      const oy=cy+i*0.17*S-0.17*S, ox=cx-i*0.05*S;
      blob([[-.95,-.34],[.95,-.34],[.95,.34],[-.95,.34]].map(q=>[ox+q[0]*S*p,oy+q[1]*S*p]),i===0?ACC:'#cfc3a6',i===0?195:150,sd+i);}
    const b=ease((t-0.55)/0.8); if(b>0){hatched(ell(cx-0.05*S,cy+0.0*S,0.3*S,0.22*S,26),GOLD,sd+4,9,35);}
    const c=ease((t-0.85)/0.9); if(c>0){pen('2B',INK,1.3,sd+5);grow([[-.95,-.34],[.95,-.34],[.95,.34],[-.95,.34]].map(q=>[cx+q[0]*S,cy+q[1]*S]),c,true);brush.noStroke();}
  },
  candles:(cx,cy,S,t,sd)=>{
    const bars=[[-.72,.5,.95],[-.24,.1,.72],[.24,-.3,.58],[.72,-.62,.86]];
    bars.forEach((b,i)=>{const p=ease((t-i*0.2)/0.75);if(p<=0)return;
      const x=cx+b[0]*S, top=cy+b[1]*S, hgt=b[2]*S*0.86*p;
      blob([[x-0.12*S,top],[x+0.12*S,top],[x+0.12*S,top+hgt],[x-0.12*S,top+hgt]],i>=2?ACC:RED,205,sd+i);
      pen('charcoal',INK,1.1,sd+10+i);pline(x,top-0.16*S,x,top+hgt+0.14*S,p);brush.noStroke();});
    const c=ease((t-0.9)/0.9);
    if(c>0){pen('marker',ACC,2.2,sd+20);pline(cx-0.8*S,cy+0.62*S,cx+0.78*S,cy-0.5*S,c);
      if(c>0.9){brush.line(cx+0.78*S,cy-0.5*S,cx+0.44*S,cy-0.44*S);brush.line(cx+0.78*S,cy-0.5*S,cx+0.72*S,cy-0.16*S);}brush.noStroke();}
  },
  bank:(cx,cy,S,t,sd)=>{
    const a=ease(t/0.85); if(a<=0)return;
    blob([[-1,-.42],[0,-.82],[1,-.42]].map(p=>[cx+p[0]*S*a,cy+p[1]*S*a]),ACC,195,sd);
    const b=ease((t-0.3)/0.8);
    if(b>0){for(let i=-1;i<=1;i++){const x=cx+i*0.46*S;blob([[x-0.12*S,cy-0.3*S],[x+0.12*S,cy-0.3*S],[x+0.12*S,cy+0.56*S],[x-0.12*S,cy+0.56*S]],'#cfc3a6',175,sd+3+i);
      hatched([[x-0.12*S,cy-0.3*S],[x+0.12*S,cy-0.3*S],[x+0.12*S,cy+0.56*S],[x-0.12*S,cy+0.56*S]],INK,sd+6+i,12,90);}}
    const c=ease((t-0.75)/0.9);
    if(c>0){blob([[-1.08,.58],[1.08,.58],[1.08,.78],[-1.08,.78]].map(p=>[cx+p[0]*S,cy+p[1]*S]),INK,205,sd+9);
      pen('2B',INK,1.3,sd+10);grow([[-1,-.42],[0,-.82],[1,-.42]].map(p=>[cx+p[0]*S,cy+p[1]*S]),c,true);brush.noStroke();}
  },
  fuel:(cx,cy,S,t,sd)=>{
    const a=ease(t/0.95); if(a<=0)return;
    const drop=[];for(let i=0;i<34;i++){const th=(i/34)*Math.PI*2;const r=(1+0.42*Math.cos(th))*0.56*S*a;drop.push([cx+Math.sin(th)*r,cy-Math.cos(th)*r*1.18]);}
    blob(drop,ACC,205,sd);
    const b=ease((t-0.4)/0.8); if(b>0)hatched(scalePts(drop,cx,cy,0.62),INK,sd+1,10,25);
    const c=ease((t-0.8)/0.9); if(c>0){pen('2B',INK,1.3,sd+2);grow(drop,c,true);brush.noStroke();}
  },
  cart:(cx,cy,S,t,sd)=>{
    const a=ease(t/0.9); if(a<=0)return;
    const body=[[-.8,-.34],[.86,-.34],[.62,.42],[-.56,.42]].map(p=>[cx+p[0]*S*a,cy+p[1]*S*a]);
    blob(body,ACC,195,sd);
    const b=ease((t-0.35)/0.8); if(b>0)hatched([[-.78,-.3],[.82,-.3],[.6,.38],[-.54,.38]].map(p=>[cx+p[0]*S,cy+p[1]*S]),INK,sd+1,12,70);
    const c=ease((t-0.7)/0.9);
    if(c>0){pen('charcoal',INK,1.3,sd+2);pline(cx-0.8*S,cy-0.34*S,cx-1.04*S,cy-0.66*S,c);
      [[-.4,.72],[.42,.72]].forEach((p,i)=>blob(ell(cx+p[0]*S,cy+p[1]*S,0.14*S*c,0.14*S*c,22),INK,225,sd+4+i));
      pen('2B',INK,1.2,sd+6);grow(body,c,true);brush.noStroke();}
  },
  bag:(cx,cy,S,t,sd)=>{
    const a=ease(t/0.9); if(a<=0)return;
    const body=[[-.68,-.3],[.68,-.3],[.82,.8],[-.82,.8]].map(p=>[cx+p[0]*S*a,cy+p[1]*S*a]);
    blob(body,ACC,200,sd);
    const b=ease((t-0.35)/0.8); if(b>0)hatched(scalePts(body,cx,cy+0.2*S,0.72),GOLD,sd+1,11,60);
    const c=ease((t-0.7)/0.9);
    if(c>0){pen('2B',INK,1.3,sd+2);grow(ell(cx,cy-0.34*S,0.3*S,0.26*S,24),c,false);grow(body,c,true);brush.noStroke();}
  },
  paycheck:(cx,cy,S,t,sd)=>{
    const a=ease(t/0.9); if(a<=0)return;
    const body=[[-.95,-.44],[.95,-.44],[.95,.44],[-.95,.44]].map(p=>[cx+p[0]*S*a,cy+p[1]*S*a]);
    blob(body,'#e7dcc2',215,sd);
    const b=ease((t-0.35)/0.8);
    if(b>0){for(let i=0;i<3;i++){const y=cy-0.16*S+i*0.2*S;pen('HB',MUTED,1.0,sd+3+i);pline(cx-0.7*S,y,cx+(i===2?0.1:0.6)*S,y,b);brush.noStroke();}
      hatched([[.38,-.3],[.86,-.3],[.86,.1],[.38,.1]].map(p=>[cx+p[0]*S,cy+p[1]*S]),ACC,sd+7,9,40);}
    const c=ease((t-0.8)/0.9); if(c>0){pen('2B',INK,1.3,sd+8);grow(body,c,true);brush.noStroke();}
  },
  chip:(cx,cy,S,t,sd)=>{
    const a=ease(t/0.9); if(a<=0)return;
    const body=[[-.6,-.6],[.6,-.6],[.6,.6],[-.6,.6]].map(p=>[cx+p[0]*S*a,cy+p[1]*S*a]);
    blob(body,ACC,200,sd);
    const b=ease((t-0.3)/0.8);
    if(b>0){hatched(scalePts(body,cx,cy,0.6),INK,sd+1,10,0);
      for(let i=-2;i<=2;i++){const o=i*0.22*S;pen('charcoal',INK,1.1,sd+5+i);
        pline(cx+o,cy-0.6*S,cx+o,cy-0.92*S,b); pline(cx+o,cy+0.6*S,cx+o,cy+0.92*S,b);
        pline(cx-0.6*S,cy+o,cx-0.92*S,cy+o,b); pline(cx+0.6*S,cy+o,cx+0.92*S,cy+o,b); brush.noStroke();}}
    const c=ease((t-0.8)/0.9); if(c>0){pen('2B',INK,1.3,sd+12);grow(body,c,true);brush.noStroke();}
  },
  plane:(cx,cy,S,t,sd)=>{
    const a=ease(t/0.9); if(a<=0)return;
    const body=[[-.95,.06],[.3,-.12],[.95,0],[.3,.16],[-.95,.1]].map(p=>[cx+p[0]*S*a,cy+p[1]*S*a]);
    blob(body,ACC,205,sd);
    const b=ease((t-0.35)/0.8);
    if(b>0){blob([[-.1,-.06],[.34,-.72],[.5,-.68],[.26,-.02]].map(p=>[cx+p[0]*S,cy+p[1]*S]),ACC,170,sd+1);
      blob([[-.1,.08],[.3,.68],[.46,.62],[.24,.06]].map(p=>[cx+p[0]*S,cy+p[1]*S]),ACC,170,sd+2);}
    const c=ease((t-0.75)/0.9); if(c>0){pen('2B',INK,1.3,sd+3);grow(body,c,true);brush.noStroke();}
  }
};

// ---------- painted chart ----------
function drawChart(ch,t,sd){
  const g=chartGeom(ch), d=ch.data;
  if(g.t==='rank'){
    const ax=ease((t-0.2)/0.6);
    if(ax>0){pen('charcoal',INK,1.3,sd);pline(g.x-10,g.y-14,g.x-10,g.y+g.n*g.rowH-10,ax);brush.noStroke();}
    d.forEach((row,i)=>{
      const p=ease((t-(0.55+i*0.42))/0.7); if(p<=0)return;
      const y=g.y+i*g.rowH+46, w=Math.abs(row[1])/g.max*g.barW*p;
      const hi=(ch.highlight!=null&&String(ch.highlight)===String(row[0]));
      wash(g.x,y,w,54,hi?RED:ACC,hi?225:165,sd+3+i);
    });
  }else{
    const ax=ease((t-0.2)/0.6);
    if(ax>0){pen('charcoal',INK,1.4,sd);pline(g.x-12,g.y1+6,CX1+12,g.y1+6,ax);brush.noStroke();}
    d.forEach((row,i)=>{
      const p=ease((t-(0.55+i*0.4))/0.7); if(p<=0)return;
      const x=g.x+i*(g.bw+g.gap);
      const hgt=(row[1]-g.lo)/((g.max-g.lo)||1)*(g.y1-g.y0)*p;
      const hi=(ch.highlight!=null&&String(ch.highlight)===String(row[0]));
      wash(x,g.y1-hgt,g.bw,hgt,hi?RED:ACC,hi?230:160,sd+3+i);
      if(hi&&p>0.6)hatched([[x,g.y1-hgt],[x+g.bw,g.y1-hgt],[x+g.bw,g.y1],[x,g.y1]],INK,sd+40,13,52);
    });
    // trend stroke across the tops
    const tr=clamp((t-1.9)/1.1);
    if(tr>0&&d.length>1){
      pen('marker',INK,1.0,sd+60);
      const pts=d.map((row,i)=>[g.x+i*(g.bw+g.gap)+g.bw/2,g.y1-(row[1]-g.lo)/((g.max-g.lo)||1)*(g.y1-g.y0)-58]);
      const segs=(pts.length-1)*tr;
      for(let i=0;i<Math.ceil(segs);i++)pline(pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1],clamp(segs-i));
      brush.noStroke();
    }
  }
}

// ---------- per-scene paint ----------
function DRAW(i,t){
  const sl=R.slides[i],k=sl.kind,sd=SEED0+i*37,g=GEO[i];
  const ch=sl.chart&&sl.chart.data&&sl.chart.data.length?sl.chart:null;
  const jit=((SEED0%7)-3);
  if(k==='hook'||(k==='body'&&sl.big)){
    const b=g.big||{x:80,y:g.top,w:920,h:160};
    const w=ease((t-0.05)/0.9);
    wash(b.x-26,b.y-26+jit,(b.w+52)*w,b.h+52,ACC,64,sd);
    const u=ease((t-0.85)/0.7);
    if(u>0){pen('marker',RED,2.2,sd+1);const y=b.y+b.h+28+jit;pline(b.x+4,y,b.x+Math.min(b.w,840),y-8,u);brush.noStroke();}
  }
  if(k==='take'){
    const h=g.head||{x:80,y:g.top,w:920,h:120};
    wash(h.x-24,h.y-22,(h.w+48)*ease((t-0.1)/0.9),h.h+44,ACC,54,sd);
    const u=ease((t-0.95)/0.8);
    if(u>0){pen('marker',RED,2.2,sd+1);const y=h.y+h.h+26;pline(h.x+4,y,h.x+Math.min(h.w,880),y-9,u);brush.noStroke();}
  }
  if(k==='end'){
    const b=ease((t-0.3)/1.0),y0=Math.max(380,g.top-70),y1=Math.min(1520,g.bot+74);
    if(b>0){brush.seed(sd+1);brush.noStroke();brush.fill(ACC,56*b);brush.fillBleed(0.1);brush.fillTexture(0.3,0.6);
      brush.rect(48,y0,984*b,y1-y0);brush.noFill();
      pen('HB',INK,1.2,sd+2);pline(48,y0,1032,y0,b);pline(1032,y1,48,y1-4,b);
      if(b>0.95){brush.line(150,y1,112,y1+74);brush.line(112,y1+74,214,y1-2);}brush.noStroke();}
  }
  if(k==='body'&&!sl.big&&!ch){
    const bar=ease((t-0.1)/0.85),y0=Math.max(360,g.top-24),hgt=Math.min(1180,(g.bot+24)-y0);
    wash(52,y0,26,hgt*bar,ACC,155,sd+1);
    const u=ease((t-0.85)/0.8);
    if(u>0){pen('HB',MUTED,1.0,sd+2);const y=Math.min(1545,g.bot+46);pline(104,y,994,y-5,u);brush.noStroke();}
  }
  if(ch) drawChart(ch,t,sd+70);
  // the illustration: on the hook, and on any chart-less body that has room
  if(k==='hook'&&!ch){
    const f=MOTIFS[MOTIF]||MOTIFS.cash;
    f(540,1160,252,clamp((t-0.5)/2.0),sd+100);
  }
}

// ---------- frames ----------
const sceneEls=SCENES.map((_,i)=>document.getElementById('s'+i));
let lastKey=null;
window.renderFrame=function(si,f){
  const t=f/FPS,dur=SCENES[si];
  const bt=Math.min(Math.floor(f/4)*4/FPS,BRUSH_END[si]);
  const key=si+':'+bt.toFixed(3);
  if(key!==lastKey){
    brush.clear(PAPER);brush.push();brush.translate(-W/2,-H/2);DRAW(si,bt);brush.pop();brush.render();
    fx.drawImage(gl,0,0,W,H);lastKey=key;
  }
  sceneEls.forEach((el,i)=>el.style.opacity=i===si?1:0);
  sceneEls[si].querySelectorAll('.t,.cl').forEach(el=>{
    const p=ease((t-parseFloat(el.dataset.in))/0.5);
    el.style.opacity=p;el.style.transform='translateY('+((1-p)*40)+'px)';
  });
  const before=SCENES.slice(0,si).reduce((a,b)=>a+b,0);
  document.querySelector('#prog i').style.width=((before+t)/TOTAL*100)+'%';
  const fin=1-clamp(t/0.25),fout=clamp((t-(dur-0.35))/0.35),last=si===SCENES.length-1;
  document.getElementById('veil').style.opacity=si===0?fout:(last?fin:Math.max(fin,fout));
};
window.ready=true;
</script>
